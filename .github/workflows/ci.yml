name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          cache: 'npm'

      - name: Create test .env
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm rebuild bcrypt @swc/core @prisma/engines prisma

      - run: npm run lint:ci

      - run: npm run tsc

      - name: Start test database
        run: docker compose -f docker/docker-compose-test.yml -p template-test up -d --wait

      - name: Run migrations
        run: ./node_modules/.bin/dotenv -e .env.test -- ./node_modules/.bin/prisma migrate deploy

      - name: Run seed
        run: ./node_modules/.bin/dotenv -e .env.test -- npm run seed

      - name: Run tests with coverage
        run: ./node_modules/.bin/dotenv -e .env.test -- npm run test:cov

      - name: Stop test database
        if: always()
        run: docker compose -f docker/docker-compose-test.yml -p template-test down --volumes

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
