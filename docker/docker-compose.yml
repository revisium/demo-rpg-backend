services:
  db:
    image: postgres:17-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: demo_rpg_backend_dev
      POSTGRES_USER: demo_rpg
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo_rpg -d demo_rpg_backend_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
